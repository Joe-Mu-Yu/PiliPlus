name: Hyper-PiliPlus Android Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (otherwise upload build artifacts only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
    secrets:
      SIGN_KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
      DEEPSEEK_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: hyper-android-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_notes: ${{ steps.release_notes.outputs.body }}
    env:
      # Use the canonical archive origin so enforce-lockfile validates the
      # exact artifacts whose checksums are recorded in pubspec.lock.
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Release notes compare the new flavor tag with the preceding one.
          fetch-depth: 0
      - name: Validate release signing secrets
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ('SIGN_KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  '::error title=Missing release signing secrets::Missing required signing secrets: '
                  + ', '.join(missing)
                  + '. Configure the existing release credentials in this repository under '
                  'Settings > Secrets and variables > Actions. Organization secrets must allow '
                  'this repository. Environment secrets require an explicitly configured job '
                  'environment. Reusable workflow callers must pass all four secrets or use '
                  'secrets: inherit. See docs/android-release.md; do not generate a replacement key.'
              )
          PY
      - name: Resolve flavor version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [ -n "$RELEASE_TAG" ]; then
            args+=(--release-tag "$RELEASE_TAG")
          elif [ "$PUBLISH" = "true" ]; then
            args+=(--next-available-tag)
          fi
          python3 scripts/release_metadata.py "${args[@]}"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reclaim runner disk space
        run: |
          df -h /
          # The Android release does not use these preinstalled hosted-runner SDKs.
          sudo rm -rf -- \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/dotnet
          # Keep only the NDK version installed explicitly below.
          sudo rm -rf -- /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install pinned Flutter source
        uses: actions/checkout@v7
        with:
          repository: flutter/flutter
          ref: 9584c6713b324636289d067944a46fd6b49df14b
          path: .fvm/flutter_sdk
          persist-credentials: false
      - name: Fetch and verify the pinned Flutter version tag
        run: |
          # A SHA-only shallow checkout omits tags; Flutter derives its version from them.
          git -C .fvm/flutter_sdk fetch --no-tags --depth=1 origin refs/tags/3.47.4:refs/tags/3.47.4
          test "$(git -C .fvm/flutter_sdk rev-parse 'refs/tags/3.47.4^{commit}')" = "$(git -C .fvm/flutter_sdk rev-parse HEAD)"
      - name: Restore the verified Flutter patch
        run: |
          git -C .fvm/flutter_sdk apply --check "$GITHUB_WORKSPACE/tool/flutter-sdk.patch"
          git -C .fvm/flutter_sdk apply "$GITHUB_WORKSPACE/tool/flutter-sdk.patch"
          ./scripts/flutterw --check-sdk
          # Bootstrap separately: the first launch can print non-JSON dependency logs.
          ./scripts/flutterw --version
          python3 - <<'PY'
          import json, subprocess
          # Flutter writes this structured cache before printing its version.
          version = json.load(open(".fvm/flutter_sdk/bin/cache/flutter.version.json"))
          expected = json.load(open(".fvmrc"))["flutter"]
          if version["frameworkVersion"] != expected:
              raise SystemExit("Unexpected Flutter version: " + version["frameworkVersion"])
          revision = subprocess.check_output(
              ["git", "-C", ".fvm/flutter_sdk", "rev-parse", "HEAD"], text=True).strip()
          if version["frameworkRevision"] != revision:
              raise SystemExit("Flutter version cache does not match the pinned SDK commit")
          print("Verified Flutter " + expected)
          PY
          ./scripts/flutterw precache --android
      - name: Install Android SDK components
        run: |
          command -v sdkmanager
          test -n "$ANDROID_HOME"
          # SDK package identifiers include the minor API version; Gradle still uses compileSdk = 37.
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
      - name: Resolve locked dependencies and apply upstream package patches
        run: |
          ./scripts/flutterw pub get --enforce-lockfile
          python3 scripts/prepare_android_ci.py
      - name: Prefetch verified native dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/prefetch_native_dependencies.py
      - name: Test release metadata and app
        run: |
          python3 -m unittest discover -s test/scripts -p '*_test.py'
          ./scripts/flutterw test --no-pub
      - name: Decode signing keystore
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os
          from pathlib import Path
          try:
              data = base64.b64decode(''.join(os.environ['SIGN_KEYSTORE_BASE64'].split()), validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit(
                  '::error title=Invalid signing keystore::SIGN_KEYSTORE_BASE64 must contain '
                  'valid Base64 for the existing release keystore. Do not paste its value into logs.'
              )
          if not data:
              raise SystemExit('::error title=Invalid signing keystore::Empty signing keystore')
          path = Path(os.environ['RUNNER_TEMP']) / 'hyper-release.jks'
          descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as output:
              output.write(data)
          PY
      - name: Build signed APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/hyper-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          df -h / &&
          ./scripts/flutterw build apk --release --split-per-abi --no-pub
          --build-name="$VERSION" --build-number="$VERSION_CODE"
          --dart-define-from-file=pili_release.json
          --android-project-arg requireReleaseSigning=true
      - name: Verify and collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            cp "$apk" "dist/Hyper-PiliPlus_android_${VERSION}_${abi}.apk"
          done
          cp pili_release.json dist/release-metadata.json
          cd dist
          sha256sum *.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Generate release notes
        id: release_notes
        if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: >-
          python3 scripts/generate_release_notes.py
          --version "${{ steps.version.outputs.version }}"
          --sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Remove temporary keystore
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'hyper-release.jks').unlink(missing_ok=True)
          PY
  publish:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-${{ needs.build.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hyper-PiliPlus ${{ needs.build.outputs.version }}
          body: ${{ needs.build.outputs.release_notes }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: dist/*
