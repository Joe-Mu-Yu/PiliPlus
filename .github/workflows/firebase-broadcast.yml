name: Firebase personal broadcast

on:
  workflow_dispatch:
    inputs:
      title:
        description: 通知标题
        required: true
        type: string
      body:
        description: 通知正文
        required: true
        type: string
      mode:
        description: 仅验证不会投递；真实发送会通知主题下所有订阅设备
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - send

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-personal-broadcast
  cancel-in-progress: false

jobs:
  send:
    name: Validate or send Firebase topic message
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Google Cloud variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FCM_SENDER_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::Set repository variable GCP_WIF_PROVIDER first."; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "::error::Set repository variable FCM_SENDER_SERVICE_ACCOUNT first."; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.FCM_SENDER_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Validate or send Firebase broadcast
        env:
          FCM_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FCM_TITLE: ${{ inputs.title }}
          FCM_BODY: ${{ inputs.body }}
          FCM_MODE: ${{ inputs.mode }}
        run: |
          if [ "$FCM_MODE" = "validate-only" ]; then
            node scripts/firebase_broadcast.mjs --validate-only
          else
            node scripts/firebase_broadcast.mjs
          fi
